<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440">
  <style>
    .ent{fill:#fff;stroke:#111;stroke-width:3px;}
    .attr{fill:#fff;stroke:#111;stroke-width:2px;}
    .rel{fill:#fff;stroke:#111;stroke-width:3px;}
    .text{font-family:Arial, Helvetica, sans-serif;font-size:15px;fill:#111}
  </style>
  <!-- Employee -->
  <rect x="40" y="40" width="160" height="44" class="ent" rx="6"/>
  <text x="120" y="70" text-anchor="middle" class="text">employee</text>
  <ellipse cx="80" cy="20" rx="40" ry="14" class="attr"/>
  <text x="80" y="24" text-anchor="middle" class="text">name</text>
  <ellipse cx="140" cy="20" rx="38" ry="14" class="attr"/>
  <text x="140" y="24" text-anchor="middle" class="text">id</text>

  <!-- Project -->
  <rect x="620" y="40" width="160" height="44" class="ent" rx="6"/>
  <text x="700" y="70" text-anchor="middle" class="text">project</text>
  <ellipse cx="700" cy="20" rx="40" ry="14" class="attr"/>
  <text x="700" y="24" text-anchor="middle" class="text">number</text>

  <!-- Machinery -->
  <rect x="320" y="260" width="160" height="44" class="ent" rx="6"/>
  <text x="400" y="290" text-anchor="middle" class="text">machinery</text>
  <ellipse cx="400" cy="330" rx="40" ry="14" class="attr"/>
  <text x="400" y="334" text-anchor="middle" class="text">id</text>

  <!-- Work relationship (top) -->
  <polygon points="220,70 320,30 420,70" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="320" y="60" text-anchor="middle" class="text">work</text>
  <line x1="200" y1="90" x2="320" y2="90" stroke="#111" stroke-width="2"/>
  <line x1="420" y1="90" x2="600" y2="90" stroke="#111" stroke-width="2"/>

  <!-- Use relationship (center) -->
  <polygon points="320,180 380,140 440,180 380,220" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="380" y="180" text-anchor="middle" class="text">use</text>
  <ellipse cx="520" cy="180" rx="46" ry="16" class="attr"/>
  <text x="520" y="184" text-anchor="middle" class="text">hours</text>

  <!-- Connections -->
  <line x1="120" y1="90" x2="320" y2="180" stroke="#111" stroke-width="2"/>
  <line x1="720" y1="90" x2="440" y2="180" stroke="#111" stroke-width="2"/>
  <line x1="400" y1="220" x2="400" y2="304" stroke="#111" stroke-width="2"/>

</svg>