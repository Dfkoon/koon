<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <style>
    .ent{fill:#fff;stroke:#111;stroke-width:3px;}
    .attr{fill:#fff;stroke:#111;stroke-width:2px;}
    .rel{fill:#fff;stroke:#111;stroke-width:3px;}
    .text{font-family:Arial, Helvetica, sans-serif;font-size:15px;fill:#111}
  </style>
  <!-- Reference entity -->
  <rect x="520" y="20" width="180" height="44" class="ent" rx="6"/>
  <text x="610" y="50" text-anchor="middle" class="text">Reference</text>
  <ellipse cx="560" cy="80" rx="48" ry="16" class="attr" />
  <text x="560" y="84" text-anchor="middle" class="text">RName</text>
  <ellipse cx="640" cy="80" rx="48" ry="16" class="attr" />
  <text x="640" y="84" text-anchor="middle" class="text">Title</text>

  <!-- Employee entity -->
  <rect x="620" y="120" width="160" height="48" class="ent" rx="6"/>
  <text x="700" y="150" text-anchor="middle" class="text">Employee</text>
  <ellipse cx="740" cy="100" rx="40" ry="14" class="attr"/>
  <text x="740" y="104" text-anchor="middle" class="text">Emp#</text>
  <ellipse cx="700" cy="165" rx="48" ry="16" class="attr"/>
  <text x="700" y="169" text-anchor="middle" class="text">EName</text>

  <!-- Automobile entity -->
  <rect x="120" y="120" width="180" height="48" class="ent" rx="6"/>
  <text x="210" y="150" text-anchor="middle" class="text">Automobile</text>
  <ellipse cx="160" cy="190" rx="48" ry="16" class="attr"/>
  <text x="160" y="194" text-anchor="middle" class="text">VIN#</text>
  <ellipse cx="240" cy="190" rx="48" ry="16" class="attr"/>
  <text x="240" y="194" text-anchor="middle" class="text">Color</text>

  <!-- Assigned relationship (weak arrow to Employee) -->
  <polygon points="320,140 380,110 420,140 380,170" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="380" y="120" text-anchor="middle" class="text">Assigned</text>
  <ellipse cx="360" cy="200" rx="36" ry="14" class="attr"/>
  <text x="360" y="204" text-anchor="middle" class="text">Date</text>

  <!-- Links -->
  <line x1="300" y1="144" x2="360" y2="144" stroke="#111" stroke-width="2"/>
  <line x1="420" y1="144" x2="620" y2="144" stroke="#111" stroke-width="2"/>

  <!-- Reference to Employee -->
  <line x1="610" y1="44" x2="650" y2="120" stroke="#111" stroke-width="2"/>

</svg>